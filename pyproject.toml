[project]
name = "workforce-risk-platform"
version = "0.1.0"
description = "Explainable workforce and project delivery risk agent"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["domain", "services/*", "packages/*"]

[dependency-groups]
dev = [
  "djlint>=1.36,<2",
  "cyclonedx-bom>=5,<8",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "playwright>=1.46,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<7",
  "pytest-socket>=0.7,<1",
  "ruff>=0.6,<1",
  "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests", "domain", "services", "packages"]
addopts = "--strict-config --strict-markers"
markers = [
  "unit: isolated tests with no network or real credentials",
  "contract: schema and component contract tests",
  "integration: tests across real process or persistence boundaries",
  "e2e: end-to-end business workflow tests",
  "infrastructure: infrastructure and deployment validation",
  "performance: bounded performance checks",
  "security: security and resilience checks",
  "ui: lightweight manager-interface tests",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
warn_unreachable = true
