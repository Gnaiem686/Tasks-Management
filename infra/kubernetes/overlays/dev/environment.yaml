apiVersion: v1
kind: ConfigMap
metadata:
  name: environment-config
  namespace: dev
data:
  APP_ENVIRONMENT: dev
  AWS_REGION: us-east-1
  BEDROCK_MODEL_ID: amazon.nova-lite-v1:0
  EVIDENCE_MODE: jira
  JIRA_PROJECT_KEY: WRD
  JIRA_CLOUD_ID: https://gnaiem686.atlassian.net
  JIRA_EMPLOYEE_ISSUE_MAP: '{"EMP-001":"WRD-2","EMP-002":"WRD-6","EMP-003":"WRD-4","EMP-004":"WRD-5","EMP-005":"WRD-7","EMP-006":"WRD-8","EMP-007":"WRD-9"}'
  WORKFORCE_CAPACITY_MAP: '{"EMP-001":40,"EMP-002":40,"EMP-003":40,"EMP-004":40,"EMP-005":32,"EMP-006":40,"EMP-007":24}'
  SCAN_EMPLOYEE_IDS: EMP-001,EMP-002,EMP-003,EMP-004,EMP-005,EMP-006,EMP-007
  JIRA_MUTATION_ENABLED: "true"
  REPORT_BUCKET: WORKFORCE_REPORT_BUCKET
  NOTIFICATION_QUEUE: WORKFORCE_NOTIFICATION_QUEUE_URL
  DAILY_SCAN_SCHEDULE: "0 6 * * *"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: dev
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef: {name: external-secrets}
