apiVersion: v1
kind: ConfigMap
metadata:
  name: environment-config
  namespace: dev
data:
  APP_ENVIRONMENT: dev
  JIRA_PROJECT_KEY: WRD
  JIRA_MUTATION_ENABLED: "true"
  REPORT_BUCKET: workforce-risk-dev-reports
  NOTIFICATION_QUEUE: workforce-risk-dev-notifications
  DAILY_SCAN_SCHEDULE: "0 6 * * *"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: dev
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef: {name: external-secrets}
      role: WORKFORCE_EXTERNAL_SECRETS_ROLE_ARN
