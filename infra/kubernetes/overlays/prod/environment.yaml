apiVersion: v1
kind: ConfigMap
metadata:
  name: environment-config
  namespace: prod
data:
  APP_ENVIRONMENT: prod
  JIRA_PROJECT_KEY: WORKFORCE-PROD
  JIRA_MUTATION_ENABLED: "false"
  REPORT_BUCKET: workforce-risk-prod-reports
  NOTIFICATION_QUEUE: workforce-risk-prod-notifications
  DAILY_SCAN_SCHEDULE: "0 5 * * *"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef: {name: external-secrets}
      role: WORKFORCE_EXTERNAL_SECRETS_ROLE_ARN
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-api
  namespace: prod
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: agent-api}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies: [{type: Percent, value: 100, periodSeconds: 60}]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Percent, value: 25, periodSeconds: 60}]
