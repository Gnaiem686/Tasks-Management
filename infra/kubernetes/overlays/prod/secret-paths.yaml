apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application-secrets
spec:
  data:
    - secretKey: DATABASE_URL
      remoteRef: {key: workforce-risk/prod/database}
    - secretKey: API_KEY_HMAC_PEPPER
      remoteRef: {key: workforce-risk/prod/api-key-pepper}
    - secretKey: INITIAL_API_KEY
      remoteRef: {key: workforce-risk/prod/initial-api-key}
    - secretKey: ATLASSIAN_MCP_CREDENTIAL
      remoteRef: {key: workforce-risk/prod/jira-mcp}
