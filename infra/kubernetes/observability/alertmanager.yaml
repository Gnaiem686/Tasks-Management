global:
  resolve_timeout: 5m
route:
  receiver: workforce-operators
  group_by: [environment, owner, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: workforce-operators
inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [environment, owner]
