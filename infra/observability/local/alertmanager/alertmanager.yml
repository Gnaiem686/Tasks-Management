global:
  resolve_timeout: 5m

route:
  receiver: local-workforce-operator
  group_by: [environment, owner, severity]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 2h

receivers:
  - name: local-workforce-operator

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [environment, owner]
