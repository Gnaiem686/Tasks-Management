global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: dev
    system: workforce-risk-manager

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: agent-api
    metrics_path: /metrics
    static_configs:
      - targets: [agent-api:8000]
        labels:
          service: agent-api

  - job_name: promtail
    static_configs:
      - targets: [promtail:9080]

  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: service-probes
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://agent-api:8000/health/ready
          - http://localstack:4566/_localstack/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: service-tcp-probes
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - workforce-risk-mcp:8001
          - devops-mcp:8002
          - postgres:5432
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
