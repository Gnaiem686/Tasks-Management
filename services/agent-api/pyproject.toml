[project]
name = "workforce-agent-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.6,<1",
  "mcp>=1.27,<2",
  "uvicorn>=0.30,<1",
  "workforce-contracts",
  "workforce-jira-mcp-client",
  "workforce-risk-domain",
  "workforce-persistence",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_api"]

[tool.uv.sources]
workforce-contracts = { workspace = true }
workforce-jira-mcp-client = { workspace = true }
workforce-risk-domain = { workspace = true }
workforce-persistence = { workspace = true }
