[project]
name = "workforce-risk-mcp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=1.27,<2",
  "workforce-risk-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workforce_risk_mcp"]

[tool.uv.sources]
workforce-risk-domain = { workspace = true }
