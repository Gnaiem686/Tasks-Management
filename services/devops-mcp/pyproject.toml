[project]
name = "workforce-devops-mcp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.35,<2",
  "httpx>=0.27,<1",
  "mcp>=1.27,<2",
  "pydantic>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devops_mcp"]
