[project]
name = "workforce-notification-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.35,<2",
  "workforce-persistence",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_worker"]

[tool.uv.sources]
workforce-persistence = { workspace = true }
