[project]
name = "workforce-jira-mcp-client"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.27,<2",
  "workforce-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_mcp_client"]

[tool.uv.sources]
workforce-contracts = { workspace = true }
